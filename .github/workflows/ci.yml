name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # No submodules any more. submodules/kicad existed only so KiCadSharp.Protos could compile
      # KiCad's .proto files; that project moved to danielmeza/kicad-sharp, which vendors them.
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # This is the gate that means something today: it proves SExpressions, KiCadSharp and
      # KiCadSharp.Protos resolve from nuget.org at the versions Directory.Build.props pins, which
      # is the whole point of consuming them as packages instead of project references.
      - name: Restore
        run: dotnet restore KiCadUltra.sln

      # The importer now compiles: the five files that still imported the pre-rename
      # `UltraLibrarianImporter.KiCadBindings` namespace were repointed at KiCadSharp, and the
      # nullable/analyzer diagnostics that `TreatWarningsAsErrors` promotes were fixed at source.
      # This step is what keeps it that way.
      #
      # It is also half of the code-style gate. Directory.Build.props sets
      # EnforceCodeStyleInBuild=true, so most IDE* rules in .editorconfig are reported by the
      # compiler and promoted to errors by TreatWarningsAsErrors. Only the build sees IDE0005
      # (unnecessary usings): it needs the documentation file the build produces, which
      # `dotnet format` does not.
      - name: Build
        run: dotnet build KiCadUltra.sln -c Release --no-restore

      # The other half. Some .editorconfig violations pass the build and only `dotnet format`
      # reports them (#59): CHARSET (`.cs` files must be utf-8-bom, and a file saved without the
      # BOM compiles fine) and IDE0001 (name can be simplified), which is set to `error` but is not
      # reported during a build. Both turned up while merging #44, with the build green throughout.
      # So this step and Build each catch something the other misses; neither replaces the other.
      #
      # `--severity warn`, never `info`: the naming rules are deliberately left at `suggestion`, and
      # `info` would turn them into failures here and into member renames in the local fix. To fix
      # what this reports, run the same command without `--verify-no-changes`.
      # Code under `#if DEBUG` exists only in Debug builds, so a Release-only CI never compiles it. #35 removed
      # a `using` that IDE0005 saw as unused in Release but that `AttachDevTools()` needs in Debug, and every
      # Debug build - including the documented `dotnet run` - broke unnoticed.
      - name: Build (Debug)
        run: dotnet build KiCadUltra.sln -c Debug --no-restore

      - name: Format
        run: dotnet format KiCadUltra.sln --severity warn --verify-no-changes --no-restore

      # The plugin's bootstrapper (#128) drives a local HTTP server that answers like GitHub's
      # releases API, and checks the four things it has to get right: a first run that downloads and
      # verifies, a second that starts offline, an asset that fails its checksum and is refused, and
      # a download cut off part-way that the next run continues. The last of those found a real
      # defect - `http.client` reports a truncated body as end-of-file, so a cut-off download looked
      # complete - which is why they run here rather than being something someone reproduces by hand.
      #
      # Standard library only, like the launcher, so there is nothing to install: `python3` on the
      # runner is enough, and no network is used. The bootstrap tests are Linux-only, because the
      # asset for Linux is a single AppImage that a shell script can stand in for; the archive and
      # asset-name tests run everywhere.
      - name: Plugin bootstrap tests
        run: python3 -m unittest discover -s tests -v

      # Still no `dotnet test` step: KiCadUltra.sln contains only the Avalonia app and
      # the SampleConsole harness, and neither is a test project. Add one here with the first test
      # project rather than running `dotnet test` over a solution that has nothing to run.

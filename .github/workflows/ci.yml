name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # KiCadSharp.Protos compiles the .proto files out of submodules/kicad. fetch-depth: 1 makes
          # actions/checkout fetch the submodule with --depth=1 too, so the ~660 MB KiCad history
          # is not cloned in full.
          submodules: recursive
          fetch-depth: 1

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore KiCadSharp.slnx

      - name: Build
        run: dotnet build KiCadSharp.slnx -c Release --no-restore

      - name: Test
        run: dotnet test KiCadSharp.slnx -c Release --no-build

      - name: Pack
        run: dotnet pack KiCadSharp.slnx -c Release --no-build -o artifacts/packages

      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
          if-no-files-found: warn

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # No submodules any more. submodules/kicad existed only so KiCadSharp.Protos could compile
      # KiCad's .proto files; that project moved to danielmeza/kicad-sharp, which vendors them.
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # This is the gate that means something today: it proves SExpressions, KiCadSharp and
      # KiCadSharp.Protos resolve from nuget.org at the versions Directory.Build.props pins, which
      # is the whole point of consuming them as packages instead of project references.
      - name: Restore
        run: dotnet restore UltraLibrarianImporter.sln

      # The importer now compiles: the five files that still imported the pre-rename
      # `UltraLibrarianImporter.KiCadBindings` namespace were repointed at KiCadSharp, and the
      # nullable/analyzer diagnostics that `TreatWarningsAsErrors` promotes were fixed at source.
      # This step is what keeps it that way.
      #
      # It is also the code-style gate. Directory.Build.props sets EnforceCodeStyleInBuild=true, so
      # the IDE* rules in .editorconfig are reported by the compiler and promoted to errors by
      # TreatWarningsAsErrors. There is deliberately no separate `dotnet format` step: it would
      # duplicate this one and still miss IDE0005, which needs the documentation file the build
      # produces. Run `dotnet format --severity warn` locally to fix what this reports.
      - name: Build
        run: dotnet build UltraLibrarianImporter.sln -c Release --no-restore

      # No `dotnet test` step: UltraLibrarianImporter.sln contains only the Avalonia app and the
      # SampleConsole harness, and neither is a test project. Add one here with the first test
      # project rather than running `dotnet test` over a solution that has nothing to run.

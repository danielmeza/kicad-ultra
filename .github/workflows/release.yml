name: Release

# Builds everything a `v*` tag releases, and attaches it to one GitHub Release:
#
#   * the Plugin and Content Manager bundle - the Python side, the icons and metadata.json, and
#     nothing else. It is a few kilobytes, and that is the point;
#   * the importer itself, as Velopack packages for linux-x64, win-x64, osx-x64 and osx-arm64.
#
# Why the two are separate (#128). A self-contained build of the importer is 453 MB, 341 MB of it
# the CEF browser the Web Browser tab runs inside - larger than KiCad's own Flatpak, and far past
# what belongs in a PCM package. So the PCM package carries the launcher, and the launcher fetches
# the application from this release on its first run, checks it against the SHA-256 published here,
# and unpacks it into a per-user data directory. From then on the application updates itself
# through Velopack, from these same releases.
#
# That replaces the decision recorded at the top of the previous version of this file, which said
# shipping the importer to end users was "a release to make once the app has been exercised, not
# before": it has been, the update path is now the app's own, and the alternative was a plugin that
# installs nothing that runs.
#
# **Code signing, wired but not switched on.** The same note said shipping self-contained binaries
# "would need code signing on Windows to avoid SmartScreen". Windows can now be signed through
# SignPath Foundation's free Open Source programme - see the long note in the `app` job and
# docs/signing.md, including what stays unsigned on purpose and why.
#
# **The unsigned path is the normal one**, not a fallback: there is no certificate yet, the
# programme requires a release to exist before it will sign one, and the next few releases will go
# out unsigned on purpose. With the SIGNPATH_* secrets absent every signing step skips, nothing
# errors, and the release is built, published and installed exactly as it was before this was
# added. That is also what a fork gets. What an unsigned build means for a user - the SmartScreen
# dialog, Smart App Control, and the fact that updating is unaffected either way - is the first
# section of docs/signing.md.
#
# macOS is still unsigned and un-notarized, so a .app is refused by Gatekeeper until the user allows
# it by hand; vpk takes --signAppIdentity / --notaryProfile when there is an Apple Developer account
# to take them from, and there is none. Neither gap blocks the plugin's own path, which downloads
# the portable artifact and runs the application inside it directly.
#
# GitHub *Releases*, not GitHub *Packages*: `https://nuget.pkg.github.com/danielmeza/index.json`
# answers 401 to an anonymous request, so a plugin user would need a personal access token to
# install; `https://api.github.com/repos/danielmeza/kicad-ultra/releases` answers 200. Velopack's
# GithubSource reads Releases.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  # What `vpk pack --packId` stamps into every package and every asset name. plugin/importer_launcher.py
  # builds the asset names it looks for from the same string, so the two have to agree.
  PACK_ID: KiCadUltra

jobs:
  app:
    name: Pack ${{ matrix.channel }}
    runs-on: ${{ matrix.runner }}
    # `actions: read` is for SignPath's action, which reads this run's job details and downloads the
    # artifact it is asked to sign through the GitHub API. `contents: read` is the workflow default,
    # repeated because naming any permission drops the rest.
    permissions:
      actions: read
      contents: read
    strategy:
      # Every channel or none: a release missing one platform's asset is a plugin that fails to
      # install on it, with no way to tell from the outside that the release is incomplete.
      fail-fast: true
      matrix:
        include:
          # Velopack can cross-compile Windows and Linux packages from any host, but a macOS package
          # needs a macOS host (codesign, productbuild). Windows is therefore packed on the Linux
          # runner - `vpk [win] pack` is the documented directive for it, and vpk refuses a foreign
          # RID without one - and the two macOS packages on macOS runners.
          #
          # The channel is baked into each package's manifest, so UpdateManager asks for the matching
          # releases.{channel}.json with no configuration in the app. `win` and `linux` are Velopack's
          # defaults for their platforms; the two macOS builds must differ from each other, or their
          # assets would collide in one release and an Intel Mac could be offered an arm64 build.
          - runner: ubuntu-latest
            rid: linux-x64
            channel: linux
            directive: ''
            icon: plugin/resources/icon-pcm-64.png
          - runner: ubuntu-latest
            rid: win-x64
            channel: win
            directive: '[win]'
            icon: ''
          - runner: macos-latest
            rid: osx-arm64
            channel: osx-arm64
            directive: ''
            icon: ''
          - runner: macos-latest
            rid: osx-x64
            channel: osx-x64
            directive: ''
            icon: ''
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # vpk comes from .config/dotnet-tools.json, pinned to the same version as the Velopack package
      # in Directory.Packages.props. The two halves write and read one package format; letting the
      # CLI float would eventually pack something the linked library cannot open.
      - name: Restore the Velopack CLI
        run: dotnet tool restore

      - name: Determine version
        id: ver
        shell: bash
        run: |
          VER=0.0.0
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then VER="${GITHUB_REF_NAME#v}"; fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      # Self-contained: the plugin installs one archive and runs it. Nothing about a KiCad install
      # implies a .NET runtime, and asking a user to install one to import a symbol is the kind of
      # step the Plugin and Content Manager exists to avoid.
      - name: Publish ${{ matrix.rid }}
        run: >
          dotnet publish src/importer/KiCadUltra/KiCadUltra.csproj
          -c Release -r ${{ matrix.rid }} --self-contained true -o publish

      # ---------------------------------------------------------------------------------------
      # Windows code signing. The whole story, including what the maintainer has to apply for, is
      # in docs/signing.md; what follows is why this shape and not another.
      #
      # It is SignPath Foundation because it is free for Open Source and nothing else is. There is
      # no .pfx in this repository and there never will be: SignPath holds the key in an HSM, CI
      # uploads the files it wants signed and gets signed ones back, and a human approves every
      # release in SignPath's UI ("Every release needs manual approval for signing",
      # https://signpath.org/terms.html). The four SIGNPATH_* secrets are the whole configuration,
      # and with any of them missing every step below is skipped and the release is built unsigned
      # - which is what a fork gets, and what this repository gets until the application is
      # approved.
      #
      # **Two rounds, and the order is not arbitrary.**
      #
      # The application's own binaries are signed *before* `vpk pack`, so their signatures are
      # inside the .nupkg and the portable .zip, and the SHA-256 that `releases.win.json` publishes
      # for the .nupkg is computed over the signed bytes. `KiCadUltra-win-Setup.exe` is signed
      # *after*, because vpk builds the installer last.
      #
      # Nothing may be re-signed inside the .nupkg afterwards. Velopack checks that SHA-256 on
      # every update and rebuilds the package from deltas that were diffed against it, so changing
      # a byte of it after packing breaks updating for everyone who already installed. The
      # installer is safe to touch for the opposite reason: checked against vpk 1.2.158 by packing
      # a throwaway app, `releases.win.json` lists the .nupkg and nothing else - not the installer,
      # not the portable .zip.
      #
      # **What is deliberately left unsigned**: Velopack's `Squirrel.exe` (the updater that ships
      # inside the package), its portable execution stub, the .NET runtime and CEF. SignPath
      # Foundation's terms forbid signing them - "The team must only sign software artifacts built
      # from their own source code" - and in the same breath allow shipping them as they are: "You
      # may include unsigned binaries of upstream OSS projects, e.g. DLL files, in your signed
      # packages".
      #
      # **Why not vpk's own `--signParams`/`--signTemplate`**, which Velopack documents and which
      # does cover every one of those files (checked locally: with a recording template, vpk 1.2.158
      # signs the stub, `Squirrel.exe`, the application's files, and then `Setup.exe`): the template
      # is run per file from inside vpk, and a SignPath signing request has to be submitted by a
      # GitHub Actions step for an artifact that GitHub Actions uploaded - that is how SignPath
      # verifies the build's origin. A route that can sign one file on demand (Azure Artifact
      # Signing is the cheap one) should use `--signTemplate` and delete all of this.
      # ---------------------------------------------------------------------------------------
      - name: Can the Windows artifacts be signed?
        id: signing
        if: matrix.channel == 'win'
        shell: bash
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG }}
        run: |
          set -euo pipefail
          missing=
          for name in SIGNPATH_API_TOKEN SIGNPATH_ORGANIZATION_ID SIGNPATH_PROJECT_SLUG \
                      SIGNPATH_SIGNING_POLICY_SLUG; do
            # Only the *name* of a secret is ever printed. No value is echoed, logged or written to
            # a file anywhere in this job.
            if [ -z "${!name:-}" ]; then missing="${missing:+$missing }$name"; fi
          done
          if [ -n "$missing" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Building unsigned Windows artifacts: $missing not set (docs/signing.md)."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Signing the Windows artifacts through SignPath."
          fi

      - name: Stage the application's binaries for signing
        id: stage-app
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        env:
          # The same executable `--mainExe` names below; keep the two in step. Its managed twin is
          # <name>.dll, where the application's code actually is - the .exe is only the apphost.
          MAIN_EXE: UltraLibrarianImporter.UI.exe
        run: |
          set -euo pipefail
          mkdir -p sign/app-in
          cp "publish/$MAIN_EXE" "publish/${MAIN_EXE%.exe}.dll" sign/app-in/
          echo "main_exe=$MAIN_EXE" >> "$GITHUB_OUTPUT"
          echo "main_dll=${MAIN_EXE%.exe}.dll" >> "$GITHUB_OUTPUT"
          ls -l sign/app-in

      - name: Upload the unsigned application binaries
        id: upload-unsigned-app
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-app-${{ matrix.channel }}
          path: sign/app-in
          if-no-files-found: error

      # Blocks until a project approver accepts the request in SignPath. Half an hour rather than
      # the action's default ten minutes, because the approval is a person, not a service.
      - name: Sign the application binaries
        if: steps.signing.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG }}
          # Optional: empty selects the project's default artifact configuration, which is what
          # `core.getInput` sees when the secret does not exist.
          artifact-configuration-slug: ${{ secrets.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned-app.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: '1800'
          output-artifact-directory: sign/app-out

      - name: Put the signed application binaries back
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        env:
          MAIN_EXE: ${{ steps.stage-app.outputs.main_exe }}
          MAIN_DLL: ${{ steps.stage-app.outputs.main_dll }}
        run: |
          set -euo pipefail
          for name in "$MAIN_EXE" "$MAIN_DLL"; do
            # SignPath returns the artifact it was given. A missing file here means the artifact
            # configuration does not describe what this workflow uploads, and packing an unsigned
            # binary while the logs say "signed" is the one outcome worth failing for.
            test -f "sign/app-out/$name"
            cp "sign/app-out/$name" "publish/$name"
          done

      # Seeds the output directory with the previous release's full package so `vpk pack` can diff
      # against it and emit a delta. It is allowed to fail: on the first release of a channel there
      # is nothing to download, and a release without a delta is complete, just larger.
      #
      # The token goes through the environment, which is the VPK_TOKEN vpk documents for --token,
      # rather than onto the command line where every other process on the runner could read it out
      # of /proc.
      - name: Fetch the previous release for the delta
        continue-on-error: true
        env:
          VPK_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          dotnet vpk ${{ matrix.directive }} download github
          --repoUrl https://github.com/${{ github.repository }}
          --channel ${{ matrix.channel }}
          --outputDir Releases

      # An icon is required to build an AppImage and is optional elsewhere, where vpk supplies its
      # own default rather than refusing. #58: the icon is part of this plugin's advertising, so it
      # stays the plugin's own artwork.
      - name: Pack ${{ matrix.channel }}
        run: >
          dotnet vpk ${{ matrix.directive }} pack
          --packId "$PACK_ID"
          --packVersion ${{ steps.ver.outputs.version }}
          --packDir publish
          --packTitle "KiCad Ultra"
          --packAuthors "Daniel Meza"
          --mainExe ${{ matrix.rid == 'win-x64' && 'KiCadUltra.exe' || 'KiCadUltra' }}
          --channel ${{ matrix.channel }}
          --runtime ${{ matrix.rid }}
          --outputDir Releases
          ${{ matrix.icon && format('--icon {0}', matrix.icon) || '' }}
        shell: bash

      # The second signing round: the installer vpk has just built. See the long note above for why
      # this one is signed here and the package's contents are not.
      - name: Stage the installer for signing
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p sign/setup-in
          cp "Releases/$PACK_ID-win-Setup.exe" sign/setup-in/

      - name: Upload the unsigned installer
        id: upload-unsigned-setup
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-installer-${{ matrix.channel }}
          path: sign/setup-in
          if-no-files-found: error

      - name: Sign the installer
        if: steps.signing.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ secrets.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned-setup.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: '1800'
          output-artifact-directory: sign/setup-out

      - name: Put the signed installer back
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -f "sign/setup-out/$PACK_ID-win-Setup.exe"
          cp "sign/setup-out/$PACK_ID-win-Setup.exe" "Releases/$PACK_ID-win-Setup.exe"

      # The one check that a release cannot make later. A signing request can succeed, return the
      # files it was given, and sign nothing at all if the artifact configuration does not cover
      # them - and an unsigned release that says "signed" in its logs is worse than an honest
      # unsigned one. This reads the shipped bytes, not the inputs: the application's two binaries
      # are read back out of the package `releases.win.json` points at, which is what a user
      # installs and what Velopack downloads to update.
      #
      # Which package that is comes from vpk's own assets.{channel}.json, the same file the staging
      # step below trusts, and not from a glob over the output directory - which also holds the
      # *previous* release's package, downloaded above for the delta. Globbing would check an
      # unsigned package from before signing existed and fail the first signed release.
      - name: Check the signed files really carry a signature
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        env:
          MAIN_EXE: ${{ steps.stage-app.outputs.main_exe }}
        run: |
          set -euo pipefail
          python3 - "Releases" "${{ matrix.channel }}" "$MAIN_EXE" <<'PY'
          import json, os, struct, sys, zipfile

          def certificate_table(blob):
              """(file offset, size) of the PE certificate table, or None if this is not a PE file."""
              if len(blob) < 0x40 or blob[:2] != b"MZ":
                  return None
              pe = struct.unpack_from("<I", blob, 0x3C)[0]
              if blob[pe:pe + 4] != b"PE\0\0":
                  return None
              optional = pe + 24
              magic = struct.unpack_from("<H", blob, optional)[0]
              if magic == 0x10B:      # PE32
                  count_at, directories = optional + 92, optional + 96
              elif magic == 0x20B:    # PE32+
                  count_at, directories = optional + 108, optional + 112
              else:
                  return None
              if struct.unpack_from("<I", blob, count_at)[0] < 5:
                  return (0, 0)
              return struct.unpack_from("<II", blob, directories + 4 * 8)

          def report(name, blob):
              table = certificate_table(blob)
              if table is None:
                  return "%s is not a PE file" % name
              if not table[1]:
                  return "%s carries no Authenticode signature" % name
              print("ok      %s (%d byte certificate table)" % (name, table[1]))
              return None

          releases, channel, main_exe = sys.argv[1], sys.argv[2], sys.argv[3]
          with open(os.path.join(releases, "assets.%s.json" % channel), encoding="utf-8") as handle:
              built = json.load(handle)

          def one(kind):
              names = [entry["RelativeFileName"] for entry in built if entry["Type"] == kind]
              if len(names) != 1:
                  raise SystemExit("expected exactly one %s asset, got %s" % (kind, names))
              return os.path.join(releases, names[0])

          package, installer = one("Full"), one("Installer")

          failures = []
          with zipfile.ZipFile(package) as archive:
              for name in ("lib/app/" + main_exe,
                           "lib/app/" + os.path.splitext(main_exe)[0] + ".dll"):
                  failures.append(
                      report("%s!%s" % (os.path.basename(package), name), archive.read(name)))
          with open(installer, "rb") as handle:
              failures.append(report(os.path.basename(installer), handle.read()))

          failures = [failure for failure in failures if failure]
          if failures:
              raise SystemExit("\n".join(failures))
          PY

      # `vpk pack` writes releases.{channel}.json from everything in the output directory, which now
      # also holds the previous release's package - downloaded above only so a delta could be built
      # against it. Staging exactly what this build produced, and cutting the index down to match, is
      # what `vpk upload github` does before it uploads; this release attaches the files itself (one
      # atomic release for four platforms plus the PCM bundle), so it has to do the same trimming.
      #
      # The legacy `RELEASES` file is deliberately not staged: it exists for clients migrating from
      # Squirrel, and this application has never shipped under Squirrel.
      #
      # Everything vpk built is staged, which includes the installers - Setup.exe on Windows and a
      # .pkg on each macOS channel. The plugin never uses them (it takes the portable artifact), but
      # they are how somebody installs the application without KiCad, and vpk 1.2.158 has no flag to
      # skip the .pkg anyway. It does mean a release carries roughly 2 GB across the four platforms;
      # the step below prints the total, and dropping the Installer entries here is a one-line change
      # if that is not wanted.
      - name: Stage this build's assets
        shell: bash
        run: |
          set -euo pipefail
          python3 - "Releases" "${{ matrix.channel }}" "staging" <<'PY'
          import json, os, shutil, sys

          releases, channel, staging = sys.argv[1], sys.argv[2], sys.argv[3]
          index_name = "releases.%s.json" % channel

          with open(os.path.join(releases, "assets.%s.json" % channel), encoding="utf-8") as handle:
              built = [entry["RelativeFileName"] for entry in json.load(handle)]

          with open(os.path.join(releases, index_name), encoding="utf-8") as handle:
              index = json.load(handle)
          index["Assets"] = [a for a in index["Assets"] if a["FileName"] in built]

          # The one way this step could fail silently. `built` and the index are two different vpk
          # files keyed by two different field names; if either ever changes, every match fails,
          # `Assets` becomes empty, the packages still upload and the release looks complete - and
          # every installed copy reads an empty feed and never updates again. An empty index is not
          # a release worth publishing, so it fails here instead.
          if not index["Assets"]:
              raise SystemExit(
                  "%s came out empty after trimming it to %s. vpk's asset names and the release "
                  "index no longer agree." % (index_name, built))

          os.makedirs(staging, exist_ok=True)
          for name in built:
              shutil.copy2(os.path.join(releases, name), os.path.join(staging, name))
          with open(os.path.join(staging, index_name), "w", encoding="utf-8") as handle:
              json.dump(index, handle, separators=(",", ":"))
          print("\n".join(sorted(os.listdir(staging))))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: velopack-${{ matrix.channel }}
          path: staging/*
          if-no-files-found: error

  bundle:
    name: Build plugin bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: ver
        shell: bash
        run: |
          VER=0.0.0
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then VER="${GITHUB_REF_NAME#v}"; fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      # PCM expects an archive whose root holds metadata.json plus the content directories.
      # An API plugin's plugin.json and entrypoint live under plugins/; the PCM icon is
      # resources/icon.png, which must be exactly 64x64 - hence icon-pcm-64.png rather than the 48x48
      # icon-light.png the plugin itself uses in the KiCad toolbar.
      #
      # There is still no plugins/bin here, and now there deliberately never will be: the launcher
      # fetches the application on first use (#128).
      - name: Stage the PCM layout
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p staging/plugins staging/resources
          cp plugin/plugin.json plugin/importer_launcher.py plugin/__init__.py \
             plugin/requirements.txt plugin/LICENSE plugin/README.md staging/plugins/
          cp -r plugin/resources staging/plugins/
          cp plugin/resources/icon-pcm-64.png staging/resources/icon.png

      # The PCM listing is this plugin's advertising. JLCPCB's API terms forbid its trademark or logo
      # in a partner's advertising and "JLC" in its website URLs, on pain of losing API access (#58):
      # keep JLCPCB (and LCSC) out of the name, description and icon, and "JLC" out of the
      # identifier, the homepage and the download URL.
      - name: Write metadata.json
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          cat > staging/metadata.json <<JSON
          {
            "\$schema": "https://go.kicad.org/pcm/schemas/v1",
            "name": "KiCad UltraLibrarian Importer",
            "description": "Import schematic symbols, footprints and 3D models from UltraLibrarian into KiCad",
            "description_full": "Browse UltraLibrarian and import the schematic symbol, footprint and 3D model for a part straight into the open KiCad project, without leaving KiCad. This package holds the launcher only; the first time the plugin is used it downloads the importer application for your platform from the project's GitHub releases, verifies it, and keeps it up to date after that.",
            "identifier": "com.github.danielmeza.kicad-ultralibrarian-importer",
            "type": "plugin",
            "author": { "name": "Daniel Meza", "contact": { "web": "https://github.com/danielmeza" } },
            "license": "MIT",
            "resources": { "homepage": "https://github.com/danielmeza/kicad-ultra" },
            "versions": [
              { "version": "${VERSION}", "status": "stable", "kicad_version": "9.0" }
            ]
          }
          JSON
          python3 -m json.tool staging/metadata.json > /dev/null

      - name: Create the archive
        id: pack
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          ARCHIVE="dist/kicad-ultralibrarian-importer-${VERSION}.zip"
          (cd staging && zip -qr "../${ARCHIVE}" .)
          echo "archive=${ARCHIVE}" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "${ARCHIVE}" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "size=$(stat -c%s "${ARCHIVE}")" >> "$GITHUB_OUTPUT"
          echo "install_size=$(du -sb staging | cut -f1)" >> "$GITHUB_OUTPUT"

      # The package is the Python side, the icons and the metadata, and it is meant to stay that
      # size. If something ever starts staging the application into it again, this fails the release
      # rather than publishing a 450 MB PCM package.
      - name: Check the bundle stayed small
        shell: bash
        env:
          SIZE: ${{ steps.pack.outputs.size }}
        run: |
          set -euo pipefail
          echo "bundle is ${SIZE} bytes"
          test "${SIZE}" -lt 1048576

      # The entry a PCM repository's packages.json needs. Emitted as a release asset so adding this
      # plugin to a repository later is copy-and-paste rather than hand-computing hashes.
      - name: Write the PCM repository entry
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          SHA: ${{ steps.pack.outputs.sha256 }}
          SIZE: ${{ steps.pack.outputs.size }}
          INSTALL_SIZE: ${{ steps.pack.outputs.install_size }}
        run: |
          set -euo pipefail
          python3 - <<'PY' > dist/pcm-entry.json
          import json, os
          version = os.environ["VERSION"]
          entry = json.load(open("staging/metadata.json"))
          entry["versions"][0].update({
              "download_sha256": os.environ["SHA"],
              "download_size": int(os.environ["SIZE"]),
              "install_size": int(os.environ["INSTALL_SIZE"]),
              "download_url": (
                  "https://github.com/danielmeza/kicad-ultra/releases/download/"
                  f"v{version}/kicad-ultralibrarian-importer-{version}.zip"
              ),
          })
          print(json.dumps(entry, indent=2))
          PY
          python3 -m json.tool dist/pcm-entry.json > /dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: kicad-plugin-bundle
          path: dist/*
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [app, bundle]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      # Named, rather than "download everything this run produced": the `app` job also uploads the
      # unsigned Windows binaries, because uploading them is how SignPath receives them. They must
      # not reach the release - and until this was spelled out they would have, because the
      # installer would then arrive twice and the duplicate check below would fail the release.
      #
      # With signing off there are no such uploads, and these two steps fetch exactly what the one
      # step before them fetched: the same files, the same basenames, the same `dist`.
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: velopack-*

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          name: kicad-plugin-bundle

      # One flat directory, because that is what a release is. Two artifacts sharing a file name
      # would silently overwrite each other here and leave the checksum file describing whichever
      # arrived last, so it is checked rather than assumed: Velopack's names carry the channel, and
      # a change that makes two channels agree has to be noticed at release time.
      - name: Collect the release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          DUPLICATES="$(find artifacts -type f -printf '%f\n' | sort | uniq -d)"
          if [ -n "$DUPLICATES" ]; then
            echo "Two artifacts carry the same file name:" >&2
            echo "$DUPLICATES" >&2
            exit 1
          fi
          find artifacts -type f -exec cp {} dist/ \;
          ls -l dist
          du -ch dist | tail -1

      # The names the plugin's launcher will ask for, asserted before anything is published.
      #
      # plugin/importer_launcher.py builds these from PACK_ID and Velopack's own naming scheme, and
      # the only two that this repository can exercise before a tag are the Linux ones - the Windows
      # and macOS names come from reading Velopack's `DefaultName`, not from a package anyone has
      # built here. If any of them is wrong, the plugin installs nothing on that platform and says
      # only "release X has no asset named ...", which is a broken release that looks complete.
      # Checking here turns that into a failed release instead, which is the difference between
      # finding out now and finding out from a user.
      - name: Check the launcher's assets are all present
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for asset in \
            "$PACK_ID.AppImage" \
            "$PACK_ID-win-Portable.zip" \
            "$PACK_ID-osx-x64-Portable.zip" \
            "$PACK_ID-osx-arm64-Portable.zip" \
            releases.linux.json releases.win.json releases.osx-x64.json releases.osx-arm64.json
          do
            if [ -f "dist/$asset" ]; then
              echo "ok      $asset"
            else
              echo "MISSING $asset" >&2
              missing=1
            fi
          done
          exit $missing

      # The launcher on a machine with no importer yet reads this file, finds the line for the asset
      # it is about to download, and refuses anything whose SHA-256 does not match. It covers every
      # file this release carries, not only the four the launcher fetches, so the Velopack packages
      # and the PCM bundle can be checked by hand the same way.
      - name: Publish a checksum for every asset
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && sha256sum * > ../SHA256SUMS.txt)
          mv SHA256SUMS.txt dist/
          cat dist/SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true

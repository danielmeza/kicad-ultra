# =============================================================================================
# OPEN DECISION - this workflow currently publishes nothing. Read before re-enabling it.
#
# Until the split, this repository packed and pushed SExpressionSharp, KiCadSharp,
# KiCadSharp.Protos and KiCadSharp.Cli to nuget.org from a `v*` tag, using Trusted Publishing
# (OIDC) through the `release` environment. All four have moved:
#
#     SExpressions                              -> github.com/danielmeza/sexpressions
#     KiCadSharp, .Protos, .Cli                 -> github.com/danielmeza/kicad-sharp
#
# and each of those repositories now carries its own copy of this workflow and needs its own
# nuget.org Trusted Publishing policy. There is nothing left here that is a NuGet package.
#
# So the publish jobs are removed rather than left pointed at a solution that no longer exists,
# and the `v*` tag trigger is removed with them, so a stray tag cannot fire a half-defined
# release. What this repository should release instead is the owner's call. The candidates:
#
#   1. The Avalonia importer as a downloadable app - `dotnet publish` per RID
#      (win-x64 / linux-x64 / osx-arm64), attached to a GitHub Release. Most useful to users,
#      most work: needs self-contained publish settings and probably code signing on Windows.
#   2. The KiCad plugin bundle - zip `plugin/` in the layout KiCad's Plugin and Content Manager
#      expects, attached to a GitHub Release, and eventually a PCM repository entry.
#      Smallest change, and arguably the actual product of this repository.
#   3. Nothing. Delete this file, keep ci.yml, and let people build from source.
#
# Recommendation: (2) now, (1) when the importer is ready to be handed to non-developers.
# They are not exclusive - one release can carry both.
#
# Whichever is chosen, the stale nuget.org Trusted Publishing policy for danielmeza/kicad-ultra
# should be deleted: it grants push rights for a workflow file that no longer pushes anything.
# =============================================================================================

name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (no artifacts published yet - see the note at the top of this file)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build UltraLibrarianImporter.sln -c Release
